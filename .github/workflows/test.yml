# Simple workflow for deploying static content to GitHub Pages
name: Tests

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "tests"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LATEST_SOLC_VERSION: "0.8.29"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build
        run: |
          npm install
          npm link
          npm run lint
      - name: Cache downloaded compilers
        id: solc-cache
        uses: actions/cache@v6
        with:
          path: /node_modules/solc-typed-ast/.compiler_cache
          key: ${{ runner.os }}-${{ env.LATEST_SOLC_VERSION }}
      - name: Pre-download compilers from historical builds archive
        run: |
            npx sol-ast-compile --download-compilers wasm
      - name: Test
        run: |
          npm run test
      - name: Upload coverage
        uses: gaelgirodon/ci-badges-action@v1
        with:
          gist-id: 588042d4225f3ba8bca30e2f3a14916d
          token: ${{ secrets.GIST_TOKEN }}